    <title>المهندس الطبي حسن فراس</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Badeen+Display&family=Cairo+Play:wght@200..1000&family=Lalezar&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #090d16;
            --bg-gradient: radial-gradient(circle at top, #1a1813 0%, #090d16 100%);
            --accent-glow: #f1c40f; /* أصفر نيون ذهبي مضيء */
            --accent-secondary: #e67e22;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --glass-bg: rgba(22, 20, 15, 0.6);
            --glass-border: rgba(255, 241, 118, 0.05);
        }

        body {
            font-family: 'Almarai', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- شاشة الترحيب السينمائية (Splash Screen) --- */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0907;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .splash-avatar-glow {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .splash-img {
            width: 180px;
            height: 180px;
            border-radius: 40px;
            object-fit: cover;
            border: 2px solid rgba(241, 196, 15, 0.4);
            transform: scale(0.3);
            opacity: 0;
            animation: scaleUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        .splash-name {
            font-family: 'Lalezar', sans-serif;
            font-size: 34px;
            font-weight: 800;
            /* تم تعديل الهامش السفلي هنا إلى 10px */
            margin: 25px 0 10px 0;
            color: var(--accent-glow); 
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
            opacity: 0;
            letter-spacing: 1px;
            animation: textReveal 1s ease-out 1.2s forwards;
        }

        .splash-sub {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 0; /* تصفير الهوامش لضمان دقة المسافة */
            opacity: 0;
            animation: textReveal 1s ease-out 1.8s forwards;
        }

        @keyframes scaleUp {
            to { transform: scale(1); opacity: 1; box-shadow: 0 0 35px rgba(241, 196, 15, 0.25); }
        }
        @keyframes textReveal {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.1)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 30px rgba(241, 196, 15, 0.35)); }
        }

        .splash-screen.fade-out {
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        /* --- الموقع الرئيسي (Main Content) --- */
        .main-content {
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .main-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .profile-container {
            margin-bottom: 35px;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 35px;
            object-fit: cover;
            border: 2px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .profile-name {
            font-family: 'Lalezar', sans-serif;
            font-size: 28px;
            font-weight: 700; 
            /* تم تعديل الهامش السفلي هنا أيضاً إلى 10px ليتطابق مع شاشة الترحيب */
            margin: 18px 0 10px 0;
            color: var(--accent-glow);
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        .profile-tag {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin: 0; /* إلغاء هوامش المتصفح التلقائية لوسم الـ p */
        }

        .section-title {

            font-size: 12px;
            font-weight: 700;
